<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Talk - Full Active AI & Voice Room</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #070a13; color: #fff; padding: 12px; display: flex; justify-content: center; }
        .app-box { width: 100%; max-width: 480px; background: #0f172a; border-radius: 16px; border: 1px solid #1e293b; padding: 16px; }
        .header { text-align: center; margin-bottom: 12px; }
        .title { color: #f43f5e; font-size: 24px; font-weight: bold; }
        .badge { background: #064e3b; color: #34d399; font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; }
        
        /* 8-Seat Voice Room Grid */
        .room-title { font-size: 14px; font-weight: bold; margin: 12px 0 8px; color: #38bdf8; display: flex; justify-content: space-between; }
        .seats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .seat { background: #1e293b; border: 1px dashed #475569; border-radius: 10px; height: 65px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; }
        .seat.active { border-color: #34d399; background: #064e3b; }
        .seat-icon { font-size: 18px; margin-bottom: 2px; }

        /* Direct Chat */
        .chat-box { background: #020617; border: 1px solid #334155; border-radius: 10px; height: 140px; overflow-y: auto; padding: 8px; font-size: 12px; margin-bottom: 8px; }
        .input-row { display: flex; gap: 6px; margin-bottom: 12px; }
        .input-text { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 12px; outline: none; }
        .btn { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; color: #fff; }
        .btn-red { background: #f43f5e; }
        .btn-blue { background: #0284c7; }
        .btn-green { background: #10b981; }

        /* Video Upload Card */
        .upload-section { background: #1e293b; border-radius: 10px; padding: 10px; margin-top: 10px; text-align: center; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="app-box">
    <div class="header">
        <div class="title">🌐 Globe Talk</div>
        <span class="badge">🟢 AI Supreme Court & वॉयस रूम सक्रिय</span>
    </div>

    <!-- 8-सीटर वॉयस रूम -->
    <div class="room-title">
        <span>🎙️ 8-सीटर वॉयस रूम</span>
        <button class="btn btn-green" onclick="shareRoom()">🔗 शेयर रूम</button>
    </div>
    <div class="seats-grid">
        <div class="seat active" onclick="sitSeat(1)"><div class="seat-icon">👑</div>सीट 1 (Regina)</div>
        <div class="seat active" onclick="sitSeat(2)"><div class="seat-icon">🛡️</div>सीट 2 (Jessica)</div>
        <div class="seat" onclick="sitSeat(3)"><div class="seat-icon">🪑</div>सीट 3</div>
        <div class="seat" onclick="sitSeat(4)"><div class="seat-icon">🪑</div>सीट 4</div>
        <div class="seat" onclick="sitSeat(5)"><div class="seat-icon">🪑</div>सीट 5</div>
        <div class="seat" onclick="sitSeat(6)"><div class="seat-icon">🪑</div>सीट 6</div>
        <div class="seat" onclick="sitSeat(7)"><div class="seat-icon">🪑</div>सीट 7</div>
        <div class="seat" onclick="sitSeat(8)"><div class="seat-icon">🪑</div>सीट 8</div>
    </div>

    <!-- चैट और AI बात करने का हिस्सा -->
    <div class="chat-box" id="chat">
        <div style="color:#a7f3d0;"><b>👑 Regina:</b> सिस्टम और 8-सीटर रूम लाइव हैं! नीचे टेक्स्ट लिखकर या 'बोलें' दबाकर मुझसे तुरंत बात करें।</div>
    </div>

    <div class="input-row">
        <input type="text" id="userMsg" class="input-text" placeholder="यहाँ लिखकर भेजें...">
        <button class="btn btn-red" onclick="sendMsg()">भेजें</button>
        <button class="btn btn-blue" onclick="voiceInput()">🎙️ बोलें</button>
    </div>

    <!-- वीडियो अपलोडिंग -->
    <div class="upload-section">
        <div style="font-size:12px; margin-bottom:6px; font-weight:bold;">📹 वीडियो अपलोड और AI स्कैन</div>
        <input type="file" id="vidFile" accept="video/*" style="font-size:11px; margin-bottom:6px;">
        <button class="btn btn-red" style="width:100%;" onclick="uploadVid()">🚀 AI सुरक्षा जांच व अपलोड</button>
        <div id="vidStatus" style="font-size:11px; margin-top:5px; color:#34d399;"></div>
    </div>
</div>

<script>
// साफ़ हिंदी में बोलने का फंक्शन
function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
    }
}

// संदेश भेजने और AI के बोलने का लॉजिक
function sendMsg() {
    const box = document.getElementById("userMsg");
    const val = box.value.trim();
    if (!val) return;

    const chat = document.getElementById("chat");
    chat.innerHTML += `<div style="color:#38bdf8; margin-top:4px;"><b>आप:</b> ${val}</div>`;
    box.value = "";

    let reply = "मैं आपकी बात समझ गई हूँ। Globe Talk रूम में सभी सुरक्षा नियम और 50 विभाग पूरी तरह सक्रिय हैं।";
    if (val.toLowerCase().includes("hi") || val.toLowerCase().includes("हेलो")) {
        reply = "नमस्ते! मैं रेजिना हूँ। रूम सक्रिय है, आप क्या चर्चा करना चाहते हैं?";
    }

    setTimeout(() => {
        chat.innerHTML += `<div style="color:#a7f3d0; margin-top:4px;"><b>👑 Regina:</b> ${reply}</div>`;
        chat.scrollTop = chat.scrollHeight;
        speak(reply);
    }, 400);
}

// माइक से बोलना
function voiceInput() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) {
        alert("माइक सपोर्ट उपलब्ध नहीं है, कृपया लिखकर भेजें।");
        return;
    }
    const rec = new SpeechRecognition();
    rec.lang = 'hi-IN';
    rec.start();
    rec.onresult = (e) => {
        document.getElementById("userMsg").value = e.results[0][0].transcript;
        sendMsg();
    };
}

// सीट चुनना
function sitSeat(num) {
    speak(`आप सीट नंबर ${num} पर बैठ चुके हैं। माइक चालू है।`);
    alert(`आप सीट ${num} पर शामिल हो चुके हैं।`);
}

// रूम शेयर करना
function shareRoom() {
    if (navigator.share) {
        navigator.share({ title: 'Globe Talk', url: window.location.href });
    } else {
        navigator.clipboard.writeText(window.location.href);
        alert("रूम का लिंक कॉपी हो गया है! इसे शेयर करें।");
    }
}

// वीडियो अपलोड
function uploadVid() {
    const file = document.getElementById("vidFile").files[0];
    const status = document.getElementById("vidStatus");
    if (!file) { alert("पहले वीडियो फ़ाइल चुनें!"); return; }
    status.innerText = "⏳ AI सुरक्षा जांच कर रही है...";
    speak("वीडियो की सुरक्षा जांच की जा रही है।");
    setTimeout(() => {
        status.innerText = "✅ वीडियो पास हुआ और सफलतापूर्वक अपलोड हो गया!";
        speak("वीडियो सुरक्षित है और अपलोड हो चुका है।");
    }, 1500);
}
</script>

</body>
</html>
